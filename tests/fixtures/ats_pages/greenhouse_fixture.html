<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Job Application Mock</title>
</head>
<body>
  <h1>Apply for AI Systems Engineer — Anthropic</h1>
  <form id="application_form" action="/submit" method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="first_name">First Name *</label>
      <input type="text" id="first_name" name="first_name" required>
    </div>
    <div class="field">
      <label for="last_name">Last Name *</label>
      <input type="text" id="last_name" name="last_name" required>
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone *</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <div class="field">
      <label for="resume">Resume/CV *</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
    </div>
    <div class="field">
      <label for="linkedin">LinkedIn Profile</label>
      <input type="text" id="linkedin" name="job_application[answers_attributes][0][text_value]">
    </div>
    <div class="field">
      <label for="website">Website / Portfolio</label>
      <input type="text" id="website" name="job_application[answers_attributes][1][text_value]">
    </div>
    <div class="field">
      <label for="work_auth">Are you legally authorized to work in the United States?</label>
      <select id="work_auth" name="job_application[answers_attributes][2][boolean_value]">
        <option value="">-- Please Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="field">
      <label for="future_sponsorship">Will you now or in the future require visa sponsorship?</label>
      <select id="future_sponsorship" name="job_application[answers_attributes][3][boolean_value]">
        <option value="">-- Please Select --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="field">
      <label for="sponsorship_details">If yes, please state your current visa status:</label>
      <textarea id="sponsorship_details" name="job_application[answers_attributes][4][text_value]"></textarea>
    </div>
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</body>
</html>
